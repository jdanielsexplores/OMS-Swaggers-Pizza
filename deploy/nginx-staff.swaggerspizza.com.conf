# /etc/nginx/sites-available/staff.swaggerspizza.com
# Then: ln -s ../sites-available/staff.swaggerspizza.com /etc/nginx/sites-enabled/ && certbot --nginx -d staff.swaggerspizza.com
server {
    listen 80;
    server_name staff.swaggerspizza.com;
    client_max_body_size 10m;            # photo / receipt uploads

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;          # AI assistant answers can take a little while
    }
}
